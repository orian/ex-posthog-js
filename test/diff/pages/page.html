<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Diff test page</title>
</head>
<body>
  <h1 id="hero">Hero</h1>
  <a id="link" href="https://example.org/out">External link</a>
  <button id="buy" class="btn primary" data-ph-capture-attribute-plan="pro">Buy <span>now</span></button>
  <form id="form"><input id="email" name="email" type="email"><input id="pw" type="password"><button type="submit">Send</button></form>
  <div style="height: 3000px"></div>
  <script src="scenarios.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search)
      var sdk = q.get('sdk')
      var bundle = q.get('bundle') || 'posthog.full.js'
      var s = document.createElement('script')
      s.src = sdk === 'official' ? '/sdk/official/array.js' : '/sdk/ours/' + bundle
      s.onload = function () {
        var h = window.DIFF_HELPERS(location.port)
        Promise.resolve(window.SCENARIOS[q.get('scenario')](window.posthog, h))
          .then(function () { window.__done = true }, function (e) { window.__error = String(e && e.stack || e); window.__done = true })
      }
      document.head.appendChild(s)
    })()
  </script>
</body>
</html>
