<!doctype html>
<html><head><meta charset="utf-8"><title>smoke</title></head>
<body>
<h1 id="hero">Old</h1>
<pre id="out">pending</pre>
<script>
  // Stub the network: record requests, answer /flags/ and /api/web_experiments/.
  var sent = [];
  window.fetch = function (url, init) {
    var headers = init && init.headers ? new Headers(init.headers) : null;
    sent.push({url: url, method: (init && init.method) || 'GET', traced: !!(headers && headers.get('X-POSTHOG-SESSION-ID'))});
    var body = /\/flags\//.test(url)
      ? {flags: {f: {key: 'f', enabled: true, variant: 'test', metadata: {}}}}
      : /web_experiments/.test(url)
      ? {experiments: [{id: 1, name: 'x', feature_flag_key: 'f', variants: {test: {transforms: [{selector: '#hero', html: 'New<script>window.__xss=1<\/script><img src=x onerror="window.__xss=1">'}]}}}]}
      : {status: 1};
    return Promise.resolve({status: 200, text: function () { return Promise.resolve(JSON.stringify(body)); }});
  };
  // headless-shell's UA says "HeadlessChrome", which the SDK (like upstream)
  // treats as a bot. Pretend to be regular Chrome for this smoke test.
  Object.defineProperty(navigator, 'userAgent', {get: function () {
    return 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36';
  }});
  Object.defineProperty(navigator, 'webdriver', {get: function () { return false; }});
  var errors = [];
  window.onerror = function (m) { errors.push(String(m)); };
</script>
<script src="../dist/chunks/core.js"></script>
<script>
  posthog.init('phc_smoke', {api_host: 'https://example.invalid', request_queue_config: {flush_interval_ms: 250}, disable_web_experiments: false,
    tracing_headers: ['api.example.invalid'], capture_performance: {web_vitals: true}});
  posthog.capture('smoke', {n: 1});
</script>
<script src="../dist/chunks/flags.js"></script>
<script src="../dist/chunks/experiments.js"></script>
<script src="../dist/chunks/exceptions.js"></script>
<script src="../dist/chunks/dom.js"></script>
<script src="../dist/chunks/autocapture.js"></script>
<script src="../dist/chunks/deadclicks.js"></script>
<script src="../dist/chunks/heatmaps.js"></script>
<script src="../dist/chunks/replay.js"></script>
<script src="../dist/chunks/webvitals.js"></script>
<script src="../dist/chunks/tracingheaders.js"></script>
<script>
  setTimeout(function () {
    document.getElementById('out').textContent = JSON.stringify({
      errors: errors,
      flag: posthog.getFeatureFlag('f'),
      hero: document.getElementById('hero').textContent,
      xss: !!window.__xss,
      distinct: !!posthog.get_distinct_id(),
      exception: !!posthog.captureException(new Error('smoke')),
      modules: [!!posthog.autocapture, !!posthog.heatmaps, !!posthog.deadClicksAutocapture],
      replay: posthog.sessionRecording ? posthog.sessionRecording.status : null,
      replayStarted: posthog.sessionRecordingStarted(),
      // file:// page: web vitals stay off (http/https only), like upstream.
      webVitals: posthog.webVitalsAutocapture ? posthog.webVitalsAutocapture.isEnabled : null,
      traced: [fetch('https://api.example.invalid/t') && sent[sent.length - 1].traced, fetch('https://example.invalid/u') && sent[sent.length - 1].traced],
      paths: sent.map(function (r) { return r.url.replace(/\?.*/, ''); }).sort()
    });
  }, 1200);
</script>
</body></html>
